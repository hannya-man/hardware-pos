# Keeps the Supabase database in step with this repository. After the server
# tests pass, it runs the API file (supabase/migrations/20261015000001_pos_api.sql)
# and every migration after 20261016000000_security_controls.sql, each written
# to be safe to run again, in one transaction: all of it applies, or none of
# it does. The same transaction records every migration file in Supabase's
# own migration history, so Supabase's GitHub integration doesn't replay
# them. Runs when any of them changes on main, or by hand (Actions >
# Update the database > Run workflow). The reason for a failure is written on
# the run's page.
#
# Uses the SUPABASE_DB_URL secret the nightly backup needs too (Supabase >
# Connect > Session pooler, with the database password: see DEPLOY.md).

name: Update the database

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**', '.github/workflows/database.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database
  cancel-in-progress: false

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Server tests first
        working-directory: tests
        run: |
          npm ci
          node sql.test.mjs

  # On a machine of its own: the packages the tests install never run where the
  # database password is, so a poisoned one can't take it from a later step.
  apply:
    needs: server-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the database secret
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Add the SUPABASE_DB_URL secret (see DEPLOY.md), then run this again."
            exit 1
          fi
          # GitHub hides the whole connection string in the log; the password on its own too.
          password="${SUPABASE_DB_URL#*://}"
          password="${password%@*}"
          echo "::add-mask::${password#*:}"

      - name: Apply to Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGCONNECT_TIMEOUT: '20'
        run: |
          command -v psql > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          files=(-f supabase/migrations/20261015000001_pos_api.sql)
          history=''
          for f in supabase/migrations/*.sql; do
            if [[ "$(basename "$f")" > "20261016000000_security_controls.sql" ]]; then files+=(-f "$f"); fi
            name=$(basename "$f" .sql)
            history+="${history:+, }('${name%%_*}', '${name#*_}')"
          done
          # Supabase's GitHub integration replays every file missing from its own
          # migration history, and the first one fails on tables that are already
          # there. All of them are in the database (the first ones were run in the
          # SQL Editor), so each is recorded there as applied.
          record="create schema if not exists supabase_migrations;
            create table if not exists supabase_migrations.schema_migrations (version text not null primary key);
            alter table supabase_migrations.schema_migrations add column if not exists statements text[], add column if not exists name text;
            insert into supabase_migrations.schema_migrations (version, name) values $history on conflict (version) do nothing;"
          echo "Applying ${files[*]}"
          if ! psql "$SUPABASE_DB_URL" --no-psqlrc -v ON_ERROR_STOP=1 --single-transaction \
              -c 'set client_min_messages to warning' "${files[@]}" -c "$record" > psql.log 2>&1; then
            cat psql.log
            why=$(awk 'NF' psql.log | tail -n 3)
            why=${why//'%'/%25}
            echo "::error::The database update failed, so nothing was changed:%0A${why//$'\n'/%0A}"
            exit 1
          fi
          echo "::notice::The database is up to date with this commit."
